[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpengine"
version = "0.4.1"
description = "A small, general-purpose multiprocessing engine: dispatch any callable across processes with run manifests, per-worker logs, on-disk outputs and failure isolation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amandeep Singh" }]
keywords = ["multiprocessing", "parallel", "concurrency", "process-pool", "vectorization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
# Floor is 3.10, not 3.13: `vermin` puts the code itself at 3.9, and the only
# dependency that would push it higher is numpy - pinned loosely below so pip
# resolves whatever numpy suits the installing interpreter. A tighter floor
# just locks out users for no reason.
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "cloudpickle>=3.0",
  "tqdm>=4.60",
  # Caps each worker's native BLAS thread count from inside the worker. The
  # environment variables mpengine sets in the parent already cover `spawn`,
  # but under `fork` the child inherits an already-loaded OpenBLAS/MKL and
  # only a runtime re-limit like this one reaches it. Pure Python, no
  # transitive dependencies.
  "threadpoolctl>=3.0",
]

[project.optional-dependencies]
# Everything needed to run `pytest` and `benchmarks/bench.py`. joblib is the
# benchmark's comparison target, not a runtime dependency of the library.
test = ["pytest>=7.0", "joblib>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Process-pool tests dominate the runtime, so they are marked rather than
# hidden: a plain `pytest` runs everything, `pytest -m "not slow"` is the
# fast inner loop.
markers = ["slow: spawns real process pools; deselect with -m 'not slow'"]
filterwarnings = ["error::DeprecationWarning:mpengine.*"]

[project.urls]
Homepage = "https://github.com/singhamandeep-kgp/multiprocessor"
Repository = "https://github.com/singhamandeep-kgp/multiprocessor"
Issues = "https://github.com/singhamandeep-kgp/multiprocessor/issues"

# Only `mpengine` is packaged. The `learning` package (src/learning) holds the
# AFML Ch.20 exercises this engine grew out of - it depends on `statarb` and is
# deliberately NOT shipped, so installing mpengine into another project never
# drags in the exercises or their data-warehouse coupling. It stays importable
# locally because the editable install puts all of src/ on sys.path.
[tool.setuptools.packages.find]
where = ["src"]
include = ["mpengine*"]

# worker_names.json and spider.txt are data, not code - setuptools' package
# discovery above only picks up .py files by default, so they need listing
# explicitly to actually ship inside a built wheel.
[tool.setuptools.package-data]
mpengine = ["worker_names.json", "spider.txt", "py.typed"]

# `statarb` (needed only by src/learning) is installed separately as an editable
# path install (pip install -e ../Equity_StatArb) rather than declared here,
# since a relative file:// dependency URL is not portably supported across pip
# versions/platforms.
